name: GPU userland (macOS 27, arm64e)

# Stage S11, route B (owner decision 12 Nov): build UniXNU's macOS GPU userland on GitHub's disposable Mac, never on a
# project machine, and fetch every input by exact public commit. This repository holds the workflow, the pins and the
# preparation/capture scripts only: no Apple material, no firmware, no keys, no trust cache, no personal data.
#
# Cost: workflow_dispatch only, one run at a time, standard macos-26 runners, a cap per job: Turnip and plugin
# 40 min each (the repository is public: standard runners are free), 8 for the environment check, 10 for the shim and absentd.
# The account-wide ledger is kept off-repo with the project notes.
#
# Caches (kit2 U7; input reuse, default yes): c12 keeps Turnip's dylib and the Rust Metal bridge in GitHub's Actions cache,
# keyed by Xcode + SDK + toolchain + the exact inputs; the bridge is taken only after UniXNU's own identity re-check
# (NMB_PREBUILT_BRIDGE). reuse=no builds both from source. c1/turnip-origin.txt and c2/bridge-origin.txt say which it was.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'c0 = environment; c12 = Turnip, plugin and daemon; shim = q33e boot shim; absentd = S5 stand-in'
        type: choice
        options: [c0, c12, shim, absentd]
        required: true
        default: c0
      xcode:
        description: 'Xcode to select: /Applications/Xcode_<version>.app (empty = newest installed)'
        required: false
        default: ''
      reuse:
        description: 'c12: yes = take a cached Turnip and Metal bridge whose identity matches this run (U7); no = build both from source'
        type: choice
        options: ['yes', 'no']
        required: false
        default: 'yes'

permissions:
  contents: read

# One run at a time; a second dispatch cancels the first rather than paying for both.
concurrency:
  group: gpu-userland
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  environment:
    name: c0 environment check
    if: inputs.stage == 'c0'
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: bash scripts/select-xcode.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Report the runner, the SDK and the toolchain targets
        run: |
          # A report, not a gate: every probe prints its answer and the step stays green, so the run always yields facts.
          report="$RUNNER_TEMP/c0-report.txt"
          work="$RUNNER_TEMP/target-test"
          mkdir -p "$work"
          {
            echo "== system"
            sw_vers
            uname -m
            sysctl -n hw.ncpu hw.memsize
            df -h "$GITHUB_WORKSPACE" | tail -n 1
            echo
            echo "== Xcode"
            echo "selected: ${XCODE_APP:-none}"
            xcodebuild -version || echo "PROBE FAILED: xcodebuild -version"
            ls -d /Applications/Xcode*.app
            echo "SDK: ${SDK_PATH:-none} (${SDK_VERSION:-unknown})"
            xcrun clang --version | head -n 2 || echo "PROBE FAILED: clang --version"
            echo
            echo "== arm64e / macOS 27 target"
            printf 'int f(void) { return 0; }\n' > "$work/t.c"
            printf 'extern "C" void *probe(void) { return (void *)0; }\n' > "$work/b.cpp"
            printf '#import <Foundation/Foundation.h>\n#import <Metal/Metal.h>\n@interface Probe : NSObject\n@end\n@implementation Probe\n+ (BOOL)hasDevice { return MTLCreateSystemDefaultDevice() != nil; }\n@end\n' > "$work/t.mm"
            if xcrun clang -target arm64e-apple-macos27.0 -isysroot "$SDK_PATH" -c "$work/t.c" -o "$work/t.o"; then
              echo "PROBE: C compiled with -target arm64e-apple-macos27.0"
              xcrun vtool -show-build "$work/t.o" 2>&1 || true
              file "$work/t.o"
              otool -hv "$work/t.o" | tail -n 1
            else
              echo "PROBE FAILED: C with -target arm64e-apple-macos27.0"
            fi
            if xcrun clang++ -target arm64e-apple-macos27.0 -isysroot "$SDK_PATH" -fobjc-arc -x objective-c++ -c "$work/t.mm" -o "$work/tmm.o"; then
              echo "PROBE: ObjC++ with Foundation and Metal compiled"
            else
              echo "PROBE FAILED: ObjC++ with Foundation and Metal"
            fi
            # The plugin's macOS link takes IOGPUMetalDevice out of the SDK's private IOGPU.tbd; prove that link here.
            if xcrun clang++ -target arm64e-apple-macos27.0 -isysroot "$SDK_PATH" -bundle -Wl,-undefined,error \
                 -F "$SDK_PATH/System/Library/PrivateFrameworks" -framework IOGPU -framework IOKit \
                 -Wl,-u,'_OBJC_CLASS_$_IOGPUMetalDevice' "$work/b.cpp" -o "$work/b.bundle"; then
              echo "PROBE: bundle link with -framework IOGPU and IOGPUMetalDevice: OK"
            else
              echo "PROBE FAILED: bundle link with -framework IOGPU"
            fi
            echo "IOGPU.tbd IOGPUMetalDevice mentions: $(grep -c IOGPUMetalDevice "$SDK_PATH/System/Library/PrivateFrameworks/IOGPU.framework/IOGPU.tbd" 2>/dev/null || echo missing)"
            echo
            echo "== toolchain"
            rustup --version || echo "PROBE FAILED: rustup"
            rustc --version || echo "PROBE FAILED: rustc"
            cargo --version || echo "PROBE FAILED: cargo"
            python3 --version
            brew --version | head -n 1
            echo
            echo "== rust 1.98.0 (the bridge's pin) with rust-src for -Z build-std"
            rustup toolchain install 1.98.0 --profile minimal --component rust-src \
              || echo "PROBE FAILED: rustup toolchain install 1.98.0"
            cargo +1.98.0 --version || echo "PROBE FAILED: cargo +1.98.0"
            rustup run 1.98.0 rustc --version || echo "PROBE FAILED: rustc 1.98.0"
            ls "$(rustup run 1.98.0 rustc --print sysroot 2>/dev/null)/lib/rustlib/src/rust/library/core/Cargo.toml" 2>/dev/null \
              || echo "PROBE FAILED: rust-src for 1.98.0"
            echo
            echo "== homebrew formula availability (not installed here)"
            brew info --json=v2 shaderc spirv-tools glslang llvm bison flex 2>/dev/null \
              | python3 -c 'import json,sys; f=json.load(sys.stdin)["formulae"]; print("\n".join("%s %s" % (x["name"], x["versions"]["stable"]) for x in f))' \
              || echo "PROBE FAILED: brew info"
          } 2>&1 | tee "$report"

      - name: Upload the environment report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: c0-report
          path: ${{ runner.temp }}/c0-report.txt
          retention-days: 1
          if-no-files-found: error

  turnip:
    name: c1 Turnip
    if: inputs.stage == 'c12'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: bash scripts/select-xcode.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Check the macOS 27 target and the private IOGPU link
        run: |
          # c0 compiles for arm64e-apple-macos27.0 and links a bundle against the SDK's private IOGPU.tbd, which is what
          # the plugin does for macOS. Cheap, and it stops a stage before the long build if the SDK cannot serve it.
          set -euo pipefail
          work="$RUNNER_TEMP/target-check"
          mkdir -p "$work"
          printf 'extern "C" void *probe(void) { return (void *)0; }\n' > "$work/b.cpp"
          xcrun clang -target arm64e-apple-macos27.0 -isysroot "$SDK_PATH" -c "$work/b.cpp" -o "$work/b.o"
          xcrun vtool -show-build "$work/b.o"
          xcrun clang++ -target arm64e-apple-macos27.0 -isysroot "$SDK_PATH" -bundle -Wl,-undefined,error \
            -F "$SDK_PATH/System/Library/PrivateFrameworks" -framework IOGPU -framework IOKit \
            -Wl,-u,'_OBJC_CLASS_$_IOGPUMetalDevice' "$work/b.cpp" -o "$work/b.bundle"
          otool -L "$work/b.bundle"
          otool -hv "$work/b.bundle" | tail -n 1

      - name: Host tools
        run: |
          # glslang: build-turnip-darwin.py refuses to run without glslangValidator. bison and flex: Mesa generates
          # ir3_parser.[ch] from ir3_parser.y and needs bison >= 3 and flex >= 2.6, while macOS ships bison 2.3 and
          # flex 2.5; bison is keg-only, so its bin goes on PATH for the build step.
          # flex is pinned to 2.6.4 and built from its release tarball (sha256-checked): flex 2.6.5..2.6.16 (10-17 Nov 2026,
          # Homebrew followed) put "#define _POSIX_C_SOURCE 1" at the top of every generated scanner, which on macOS hides
          # Dl_info/dladdr from src/util/disk_cache.h when Mesa compiles ir3_lexer.c (runs 44133142885, 44137387938).
          brew install glslang bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix bison)/bin/bison" --version | head -n 1
          flex_dir="$RUNNER_TEMP/flex-2.6.4"
          curl -fsSL -o "$RUNNER_TEMP/flex-2.6.4.tar.gz" https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz
          echo "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995  $RUNNER_TEMP/flex-2.6.4.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/flex-2.6.4.tar.gz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/flex-2.6.4" && ./configure --prefix="$flex_dir/install" --disable-nls --disable-shared > "$RUNNER_TEMP/flex-configure.log" 2>&1 \
            && make -j"$(sysctl -n hw.ncpu)" > "$RUNNER_TEMP/flex-make.log" 2>&1 && make install > /dev/null 2>&1) \
            || { tail -n 40 "$RUNNER_TEMP"/flex-*.log; exit 1; }
          echo "$flex_dir/install/bin" >> "$GITHUB_PATH"
          "$flex_dir/install/bin/flex" --version

      - name: Fetch the pinned sources
        run: bash scripts/prepare-inputs.sh unixnu mesa venv

      - name: Verify the pins before building
        run: python3 scripts/verify-pins.py unixnu mesa

      - name: Key a cached Turnip
        id: turnip-key
        if: inputs.reuse != 'no'
        run: |
          # U7 (as sheng's macos-lab.yml keys its build caches by Xcode and SDK): the dylib depends on the toolchain (Xcode, the
          # macOS SDK, the host tools that generate Mesa sources) and on the exact Mesa tree, which verify-pins just proved is the
          # pin plus UniXNU's record plus ours. The key covers all of them; a miss builds from source as before.
          set -euo pipefail
          key="$(python3 - <<'KEY'
          import hashlib, json, os, subprocess
          run = lambda *a: subprocess.run(a, capture_output=True, text=True).stdout
          pins = json.load(open('pins/inputs.json'))
          parts = [run('xcodebuild', '-version'), os.environ.get('SDK_VERSION', ''), run('bison', '--version').splitlines()[0],
                   run('flex', '--version'), run('glslangValidator', '--version').splitlines()[0] if run('glslangValidator', '--version') else '',
                   run('unixnu/.cache/mesa-venv/bin/meson', '--version'), run('unixnu/.cache/mesa-venv/bin/ninja', '--version'),
                   pins['unixnu']['commit'], json.dumps(pins['unixnu']['submodules'], sort_keys=True), pins['mesa']['commit'],
                   run('git', '-C', 'unixnu/.cache/mesa-work', 'diff', 'HEAD'),
                   open('unixnu/scripts/data/adreno-compiler-inputs.json').read()]
          print('turnip-macos27-v1-' + hashlib.sha256('\0'.join(parts).encode()).hexdigest()[:24])
          KEY
          )"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "== Turnip cache key $key"

      - name: Restore a cached Turnip
        id: turnip-cache
        if: inputs.reuse != 'no'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.turnip-key.outputs.key }}
          path: ${{ runner.temp }}/turnip-cache

      - name: Use the cached Turnip
        if: steps.turnip-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          out="unixnu/build/mesa-tu-macos27"
          mkdir -p "$out/src/freedreno/vulkan"
          cp "$RUNNER_TEMP/turnip-cache/libvulkan_freedreno.dylib" "$out/src/freedreno/vulkan/"
          cp "$RUNNER_TEMP/turnip-cache/builtin-build-profile.json" "$out/"
          echo "== reused Turnip ${{ steps.turnip-key.outputs.key }}: $(shasum -a 256 "$out/src/freedreno/vulkan/libvulkan_freedreno.dylib")"
          echo "TURNIP_ORIGIN=reused ${{ steps.turnip-key.outputs.key }}" >> "$GITHUB_ENV"

      - name: Build Turnip with the Darwin kernel backend
        if: steps.turnip-cache.outputs.cache-hit != 'true'
        working-directory: unixnu
        run: python3 scripts/build-turnip-darwin.py --target macos27

      - name: Keep the Turnip build for the next run
        if: inputs.reuse != 'no' && steps.turnip-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/turnip-cache"
          cp unixnu/build/mesa-tu-macos27/src/freedreno/vulkan/libvulkan_freedreno.dylib unixnu/build/mesa-tu-macos27/builtin-build-profile.json \
            "$RUNNER_TEMP/turnip-cache/"

      - name: Save the Turnip build
        if: inputs.reuse != 'no' && steps.turnip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.turnip-key.outputs.key }}
          path: ${{ runner.temp }}/turnip-cache

      - name: Sign and capture Turnip's dylib
        run: |
          set -euo pipefail
          lib="unixnu/build/mesa-tu-macos27/src/freedreno/vulkan/libvulkan_freedreno.dylib"
          # The plugin build signs its own copy the same way (build-adreno-metal-plugin.py); this one is the artifact.
          codesign --force --sign - --pagesize 4096 --identifier org.blu-sharky.turnip "$lib"
          mkdir -p artifacts/c1
          cp "$lib" artifacts/c1/
          cp unixnu/build/mesa-tu-macos27/builtin-build-profile.json artifacts/c1/
          echo "${TURNIP_ORIGIN:-built from source in this run}" > artifacts/c1/turnip-origin.txt
          tail -n 400 unixnu/.cache/mesa-tu-macos27-build.log > artifacts/c1/mesa-build.log || true
          tail -n 200 unixnu/.cache/mesa-tu-macos27-configure.log > artifacts/c1/mesa-configure.log || true
          bash scripts/capture-signature.sh artifacts/c1/libvulkan_freedreno.dylib artifacts/c1
          cd artifacts
          python3 ../scripts/make-manifest.py --stage c1 --out c1/manifest.json c1

      - name: Build logs on failure
        if: failure()
        run: |
          for log in unixnu/.cache/mesa-tu-macos27-configure.log unixnu/.cache/mesa-tu-macos27-build.log; do
            [ -f "$log" ] || continue
            echo "== tail of $log"
            tail -n 120 "$log"
          done

      - name: Upload the Turnip artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: c1-turnip
          path: artifacts/c1
          retention-days: 1
          if-no-files-found: error

  plugin:
    name: c2 plugin and daemon
    if: inputs.stage == 'c12'
    needs: turnip
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: bash scripts/select-xcode.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Host tools
        run: |
          # llvm-as and llvm-objcopy for the bridge's AIR fixtures and the PAC symbol renames; shaderc (glslc) and
          # spirv-tools (spirv-val) for the generated smoke shaders.
          brew install llvm glslang shaderc spirv-tools

      - name: Rust 1.98.0 with rust-src (arm64e std built from source)
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          cargo +1.98.0 --version
          rustup run 1.98.0 rustc --version

      - name: Fetch the pinned sources
        run: bash scripts/prepare-inputs.sh unixnu mesa venv metal2vulkan

      - name: Verify the pins before building
        run: python3 scripts/verify-pins.py

      - name: Restore the Turnip build of c1
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: c1-turnip
          path: c1-turnip

      - name: Key a prebuilt Metal bridge
        id: bridge-key
        if: inputs.reuse != 'no'
        run: |
          # U7: the Rust bridge (libadreno_metal_bridge.a, fat LTO, most of this job's time) depends on the toolchain (Xcode, the
          # macOS SDK, rustc 1.98.0 and its rust-src), the translator pin and the patched AdrenoMetal tree. The key covers them.
          # It is only a lookup: UniXNU's builder (NMB_PREBUILT_BRIDGE, build-adreno-metal-bridge.py) re-checks the archive's
          # recorded identity (target, translator, patched translator tree, AdrenoMetal commit, Cargo manifest, the sha256 of
          # every bridge/*.rs and shader fixture) and the archive's own sha256 before it uses it, so a stale entry costs a rebuild.
          set -euo pipefail
          key="$(python3 - <<'KEY'
          import hashlib, json, os, subprocess
          run = lambda *a: subprocess.run(a, capture_output=True, text=True).stdout
          pins = json.load(open('pins/inputs.json'))
          am = 'unixnu/drivers/AdrenoMetal'
          parts = [run('xcodebuild', '-version'), os.environ.get('SDK_VERSION', ''), run('rustup', 'run', '1.98.0', 'rustc', '-vV'),
                   pins['translator']['commit'], run('git', '-C', am, 'rev-parse', 'HEAD'), run('git', '-C', am, 'diff', 'HEAD'),
                   open('unixnu/scripts/build-adreno-metal-bridge.py').read(), open('unixnu/scripts/data/gpu-metal-vulkan-inputs.json').read()]
          print('metal-bridge-macos27-v1-' + hashlib.sha256('\0'.join(parts).encode()).hexdigest()[:24])
          KEY
          )"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "== Metal bridge cache key $key"

      - name: Restore a prebuilt Metal bridge
        id: bridge-cache
        if: inputs.reuse != 'no'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.bridge-key.outputs.key }}
          path: ${{ runner.temp }}/metal-bridge

      - name: Check the prebuilt bridge's identity
        if: steps.bridge-cache.outputs.cache-hit == 'true'
        working-directory: unixnu
        run: |
          # UniXNU's own check (d73e814): the builder takes the archive only if its identity and sha256 match this tree, and stops
          # with "Prebuilt Metal bridge differs ..." otherwise. On a match the plugin build below gets NMB_PREBUILT_BRIDGE too
          # (the same check runs again there); on a mismatch it builds the bridge from source as before.
          set -uo pipefail
          record="$RUNNER_TEMP/metal-bridge/libadreno_metal_bridge.a.json"
          if NMB_PREBUILT_BRIDGE="$record" python3 scripts/build-adreno-metal-bridge.py --target macos27; then
            echo "NMB_PREBUILT_BRIDGE=$record" >> "$GITHUB_ENV"
            echo "BRIDGE_ORIGIN=reused ${{ steps.bridge-key.outputs.key }} (identity and sha256 re-checked)" >> "$GITHUB_ENV"
          else
            echo "::warning::the cached Metal bridge does not match this tree; building it from source"
          fi

      - name: Build the Metal plugin and the probe daemon
        working-directory: unixnu
        run: |
          set -euo pipefail
          mkdir -p build/mesa-tu-macos27/src/freedreno/vulkan
          cp ../c1-turnip/libvulkan_freedreno.dylib build/mesa-tu-macos27/src/freedreno/vulkan/
          cp ../c1-turnip/builtin-build-profile.json build/mesa-tu-macos27/ 2>/dev/null || true
          # --no-replay: the prefix replay is a host-simulation capture (scripts/gen-turnip-replay.py builds and runs the
          # desktop plugin smoke), not part of the bundle. The plugin still compiles: TurnipReplay.h is optional
          # (NativeAdrenoUserTest.h includes it under __has_include). The owner trust module
          # (scripts/make-owner-trust-bundle.py) is never built here; it needs Apple trust caches and is built locally.
          python3 scripts/build-adreno-metal-plugin.py --target macos27 --no-replay

      - name: Keep the Metal bridge for the next run
        if: inputs.reuse != 'no' && env.NMB_PREBUILT_BRIDGE == ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metal-bridge"
          cp unixnu/build/adreno-metal-bridge/macos27/libadreno_metal_bridge.a unixnu/build/adreno-metal-bridge/macos27/libadreno_metal_bridge.a.json \
            "$RUNNER_TEMP/metal-bridge/"

      - name: Save the Metal bridge
        if: inputs.reuse != 'no' && env.NMB_PREBUILT_BRIDGE == '' && steps.bridge-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.bridge-key.outputs.key }}
          path: ${{ runner.temp }}/metal-bridge

      - name: Build the Shader Cache app
        working-directory: unixnu
        run: |
          set -euo pipefail
          # AdrenoMetal's own builder (tools/build-shader-cache-app.py): on macOS the shader priming (PrimeShaders.h) runs only in
          # this app's root worker, never in the plugin. Built from the same patched AdrenoMetal tree as the plugin, signed ad hoc;
          # it writes shader-cache-trust.json (the three CDHashes) beside the app.
          python3 drivers/AdrenoMetal/tools/build-shader-cache-app.py build/adreno-metal-plugin-macos27

      - name: Sign reports, manifest and bundle tarball
        run: |
          set -euo pipefail
          out="unixnu/build/adreno-metal-plugin-macos27"
          bundle="$out/NativeAdrenoMetal.bundle"
          mkdir -p artifacts/c2
          bash scripts/capture-signature.sh "$bundle" artifacts/c2
          bash scripts/capture-signature.sh "$bundle/Contents/MacOS/NativeAdrenoMetal" artifacts/c2
          bash scripts/capture-signature.sh "$bundle/Contents/MacOS/libvulkan_freedreno.dylib" artifacts/c2
          bash scripts/capture-signature.sh "$out/adrenoprobed" artifacts/c2
          app="$out/Shader Cache.app"
          bash scripts/capture-signature.sh "$app" artifacts/c2
          for exe in ShaderCache ShaderCacheWorker ShaderCacheRegister; do
            bash scripts/capture-signature.sh "$app/Contents/MacOS/$exe" artifacts/c2
          done
          tar -czf artifacts/c2/ShaderCache.app.tar.gz -C "$out" "Shader Cache.app"
          cp "$out/shader-cache-trust.json" artifacts/c2/
          tar -czf artifacts/c2/NativeAdrenoMetal.bundle.tar.gz -C "$out" NativeAdrenoMetal.bundle
          cp "$out/adrenoprobed" "$out/trust.json" artifacts/c2/
          cp "$bundle/Contents/MacOS/libvulkan_freedreno.dylib" artifacts/c2/
          tail -n 200 "$out/build-macos27.log" > artifacts/c2/bridge-build.log || true
          # U7: where the Rust bridge came from, and its full identity record, for the trust review.
          echo "${BRIDGE_ORIGIN:-built from source in this run}" > artifacts/c2/bridge-origin.txt
          cp unixnu/build/adreno-metal-bridge/macos27/libadreno_metal_bridge.a.json artifacts/c2/bridge-identity.json
          # m2v1 P2: the plugin's debug symbols (same UUID as the stripped binary), for symbolizing spindumps offline; not installed.
          if [ -d "$out/NativeAdrenoMetal.dSYM" ]; then tar -czf artifacts/c2/NativeAdrenoMetal.dSYM.tar.gz -C "$out" NativeAdrenoMetal.dSYM; fi
          cd artifacts
          python3 ../scripts/make-manifest.py --stage c2 --out c2/manifest.json c2

      - name: Build logs on failure
        if: failure()
        run: |
          for log in unixnu/build/adreno-metal-plugin-macos27/build-macos27.log \
                     unixnu/.cache/mesa-tu-macos27-configure.log unixnu/.cache/mesa-tu-macos27-build.log; do
            [ -f "$log" ] || continue
            echo "== tail of $log"
            tail -n 150 "$log"
          done

      - name: Upload the plugin artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: c2-plugin
          path: artifacts/c2
          retention-days: 1
          if-no-files-found: error

  shim:
    name: q33e owner boot shim
    if: inputs.stage == 'shim'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: bash scripts/select-xcode.sh

      - name: Fetch UniXNU at its pin
        run: bash scripts/prepare-inputs.sh unixnu

      - name: Verify the pins before building
        run: python3 scripts/verify-pins.py unixnu

      - name: Build and sign the owner boot shim
        run: |
          # Mirrors scripts/build-boot-runtime.py's build_boot_shims() at the pin (its lines 100-104): Apple's clang for
          # arm64e-apple-macos27.0 against the macOS SDK with -O2 -Wall -Werror, then an ad-hoc signature with 4 KiB pages
          # and the identifier org.unixnu.apfs_boot_util. No entitlements, no network, one C file
          # (scripts/macos-boot-shims/apfs_boot_util.c). The addon packing (NGPUADD2, addon-add-dir.py) is the QEMU
          # session's step, not this job's.
          set -euo pipefail
          mkdir -p artifacts/shim
          xcrun --sdk macosx clang -target arm64e-apple-macos27.0 -isysroot "$SDK_PATH" -O2 -Wall -Werror \
            unixnu/scripts/macos-boot-shims/apfs_boot_util.c -o artifacts/shim/apfs_boot_util
          codesign --force --sign - --pagesize 4096 --identifier org.unixnu.apfs_boot_util artifacts/shim/apfs_boot_util
          bash scripts/capture-signature.sh artifacts/shim/apfs_boot_util artifacts/shim
          cd artifacts
          python3 ../scripts/make-manifest.py --stage shim --out shim/manifest.json shim

      - name: Upload the shim artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: q33e-shim
          path: artifacts/shim
          retention-days: 1
          if-no-files-found: error

  absentd:
    name: S5 absent-service stand-in
    if: inputs.stage == 'absentd'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: bash scripts/select-xcode.sh

      - name: Check the copied source against its pin
        run: |
          # The source is UniXNU's file with one provenance line prepended; pins/inputs.json records both hashes.
          python3 -c 'import hashlib, json; p = json.load(open("pins/inputs.json"))["sources"]["absentd"]; a = hashlib.sha256(open(p["path"], "rb").read()).hexdigest(); print(p["path"], a); assert a == p["sha256"], "the copied source differs from its pin"; print("PASS: unchanged since it was copied from", p["upstream_path"], "at", p["commit"][:12])'

      - name: Build and sign the stand-in
        run: |
          # Mirrors scripts/absent-service/build.py at UniXNU 9248bdac: Apple's clang for arm64e-apple-macos27.0 with
          # -Os -Wall -Wextra -Werror -fblocks and CoreFoundation, then an ad-hoc 4 KiB signature with the identifier
          # org.unixnu.absentd and no entitlements. The addon (NGPUADD2, bin/unixnu-absentd), its hash and the owner
          # trust entry are the QEMU session's steps, not this job's.
          set -euo pipefail
          mkdir -p artifacts/absentd
          xcrun --sdk macosx clang -target arm64e-apple-macos27.0 -isysroot "$SDK_PATH" -Os -Wall -Wextra -Werror \
            -fblocks -framework CoreFoundation -o artifacts/absentd/unixnu-absentd absent-service/absentd.c
          codesign --force --sign - --pagesize 4096 --identifier org.unixnu.absentd artifacts/absentd/unixnu-absentd
          codesign --verify --strict artifacts/absentd/unixnu-absentd
          bash scripts/capture-signature.sh artifacts/absentd/unixnu-absentd artifacts/absentd
          cd artifacts
          python3 ../scripts/make-manifest.py --stage absentd --out absentd/manifest.json absentd

      - name: Upload the stand-in artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: unixnu-absentd
          path: artifacts/absentd
          retention-days: 1
          if-no-files-found: error
